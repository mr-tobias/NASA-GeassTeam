<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 480" role="img" aria-labelledby="title desc">
  <title id="title">GEASS crow emblem</title>
  <desc id="desc">A sharp, geometric raven in flight, rendered in charcoal and steel gray with a crimson eye.</desc>
  <defs>
    <linearGradient id="feather" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#66666f"/>
      <stop offset=".48" stop-color="#292930"/>
      <stop offset="1" stop-color="#101014"/>
    </linearGradient>
    <linearGradient id="wing" x1="0" y1="0" x2=".9" y2="1">
      <stop offset="0" stop-color="#777780"/>
      <stop offset=".35" stop-color="#383840"/>
      <stop offset="1" stop-color="#151519"/>
    </linearGradient>
    <filter id="glow" x="-50%" y="-50%" width="200%" height="200%"><feGaussianBlur stdDeviation="5" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
  </defs>
  <!-- swept-back wing -->
  <path d="M286 228 54 52l114 163L18 153l154 151L62 278l173 95 95-34z" fill="url(#wing)" stroke="#85858e" stroke-opacity=".42" stroke-width="3"/>
  <path d="m245 260-159-95 129 132-101 2 144 49" fill="none" stroke="#9999a2" stroke-opacity=".3" stroke-width="5"/>
  <!-- tail feathers -->
  <path d="m290 292-186 119 213-62-118 103 168-94 15-90z" fill="#202026" stroke="#65656e" stroke-opacity=".45" stroke-width="3"/>
  <!-- body and neck -->
  <path d="M190 280c43-63 105-98 186-98 44 0 82 17 111 46l69-8-53 35 36 18-76 8c-31 63-89 102-164 103-68 0-115-35-109-104z" fill="url(#feather)" stroke="#85858e" stroke-opacity=".4" stroke-width="3"/>
  <!-- head and beak -->
  <path d="M405 190c29-35 82-37 112-10 18 16 22 39 12 60-11 24-36 37-67 34l-42-13-25-30z" fill="#17171c" stroke="#777780" stroke-width="3"/>
  <path d="m511 218 112 20-101 15-25-11z" fill="#a7a7ae"/>
  <path d="m511 218 112 20-101 15" fill="none" stroke="#e0e0e3" stroke-opacity=".5" stroke-width="2"/>
  <circle cx="478" cy="216" r="7" fill="#e23a46" filter="url(#glow)"/>
  <path d="M320 225c46 20 83 52 106 91M270 270c38 22 66 48 82 79" fill="none" stroke="#9999a2" stroke-opacity=".25" stroke-width="5"/>
  <path d="m219 300 79 45-44-2M160 249l92 57-64-5" fill="none" stroke="#c5c5ca" stroke-opacity=".16" stroke-width="4"/>
</svg>
